<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前后端分离计算器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="calculator">
      <h1 class="title">前后端分离计算器</h1>
      <p class="hint">计算由<strong>后端</strong>完成，前端仅负责交互与展示。</p>

      <div id="display" class="display" aria-live="polite">0</div>
      <div id="status" class="status"></div>

      <div class="keys">
        <button class="key key-fn" data-action="clear">C</button>
        <button class="key key-fn" data-action="back">⌫</button>
        <button class="key key-op" data-value="(">(</button>
        <button class="key key-op" data-value=")">)</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key-op" data-value="÷">÷</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key-op" data-value="×">×</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key-op" data-value="-">−</button>

        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key-op" data-value="+">+</button>
        <button class="key key-eq" data-action="equal">=</button>
      </div>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>计算历史</h2>
        <button id="refresh" class="btn-small">刷新</button>
      </div>
      <ul id="history-list" class="history-list">
        <li class="empty">暂无历史记录</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
